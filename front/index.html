<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atividades Formativas</title><link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css"></head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="#">Atividades Formativas</a><a class="btn btn-outline-light" href="#cadastro">Cadastro</a></div></nav>
<main class="container py-4">
<header class="mb-4"><h1>Gerenciamento de atividades</h1><p class="text-secondary">Consulte e gerencie cursos e workshops.</p></header>
<div id="mensagem" class="alert d-none" role="alert" aria-live="polite"></div>
<section class="card mb-4" id="cadastro"><div class="card-body"><h2 class="h4" id="tituloForm">Nova atividade</h2>
<form id="formulario" class="row g-3" novalidate>
<div class="col-md-4"><label for="tipo" class="form-label">Tipo</label><select id="tipo" class="form-select"><option value="curso">Curso</option><option value="workshop">Workshop</option></select></div>
<div class="col-md-5"><label for="titulo" class="form-label">Título</label><input id="titulo" class="form-control" required><div class="invalid-feedback">Informe o título.</div></div>
<div class="col-md-3"><label for="ano" class="form-label">Ano</label><input id="ano" type="number" min="0" step="1" class="form-control" required><div class="invalid-feedback">Informe um ano válido.</div></div>
<div id="campos" class="row g-3 mx-0 px-0"></div>
<div class="col-12"><button id="salvar" class="btn btn-primary" type="submit">Cadastrar</button> <button id="cancelar" class="btn btn-secondary d-none" type="button">Cancelar edição</button></div>
</form></div></section>
<section><div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h2 class="h4 mb-0">Atividades cadastradas</h2><button id="atualizar" class="btn btn-outline-primary">Atualizar lista</button></div><p id="carregando" class="d-none" role="status">Carregando...</p><div id="lista" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div></section>
</main><footer class="container border-top py-3 text-secondary">Desenvolvimento Web e Mobile I</footer>
<div class="modal fade" id="detalhes" tabindex="-1" aria-labelledby="detalhesTitulo" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="detalhesTitulo">Descrição</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body" id="detalhesTexto"></div></div></div></div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script><script src="script.js"></script></body></html>
